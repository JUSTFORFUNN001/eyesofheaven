    "content": "\"Let's set sail!\"\nThe shout comes from a man built like the ocean chewed on him and decided not to finish — scruffy, sun-cracked, hunched just slightly over the wooden rail as though the weight of thirty years at sea had finally started collecting in his spine. Below him, on the deck, a hundred men look up from their ropes and their salt-stained boots. Beside him, close enough to be trusted and no closer, stands his right hand.\n\"Captain.\" Rye chooses his words the way a man chooses his footing on wet planking. \"How do you know this island even exists? It's never been recorded on a single map. We could be sailing into dead ocean.\"\nThe captain is fifty-two years old, though the sea has never let him look it — some years he looks older, and some years, cruelly, he looks like a man half that age who has simply seen too much. Black beard, unkempt, hair braided long down a back built like an ox that learned to walk upright out of spite. Boots caked in mud so old it may as well be a second sole. His trousers look as though they were born on him, sewn into his skin sometime before he was a man at all. Scars run the length of both arms — old arguments with the Inglis's steel, most of them won. Sweat or seawater, it's never clear which, glistens permanently across a brow drawn low and thick over one good eye.\nThe other socket is empty. Has been for longer than most of this crew has been alive.\n\"I've seen it.\"  he tilts his head back toward the sun, closing the one eye that still works. \"I've seen the island, and the riches sitting on it, waiting. It came to me from the gods themselves, Rye. The Inglis haven't caught wind of it yet. Better we lay claim to it now, before fate swindles us out of one more thing.\" A pause, deliberate, the kind he's good at. \"Do you trust me, first mate?\"\n\"Aye, Captain.\" Rye tilts his head away. \"Ten years now, since you took me in a wee pup off some forgotten dock. Second-in-command of two ships and better than two hundred men. Greatest pirates to ever curse this ocean, and it's all on account of you.\"\nBehind them, cutting a clean wake through water still glowing gold with the last of the light, The Harvest keeps pace — the captain's second ship, taken not bought, off an admiral who'd made the mistake of anchoring near a half-ravaged shipyard the captain happened to be passing on a detour. The admiral\nSplash .\nThe ship survived the battle , badly, and was made whole again under the captain's own hand — patched, rerigged, repainted. The Harvest sat low in the water, a compact yet deadly tooth in the maw of the King's navy. She was a Sixth-Rate frigate, an oak-ribbed predator built for speed and packed with one hundred souls — and every single one of them was crammed into her hundred-and-ten-foot hull. {{ Historical reference: “Sixth-rate” was a Royal Navy classification used for smaller warships, particularly in the age of sail. }}\nFrom her raked sterncastle to the sharp beakhead at her bow, she smelled of Stockholm tar, wet canvas, and the sharp, metallic tang of black powder. Three masts pierced the horizon, rigged with a cloud of square-sailed canvas that could catch the faintest breath of the salty wind and turn it into a furious chase. {{ Historical reference: Stockholm tar was historically used as a preservative and waterproofing material for wooden ships and their rigging. }}\nBelow the main deck lay her true teeth: a single, dark gun deck where twenty-four iron cannons sat lashed to the bulkheads like sleeping beasts. Here, the air was thick and heavy. At night, it became a labyrinth, choked with the heat of one hundred sweating men slung shoulder-to-shoulder in tight hammocks, their bodies swaying in unison with the heavy roll of the timber hull. She was small enough to dance through treacherous coastal shallows, yet fierce enough to hunt down the Inglis, with their own flag, the Inglis flag. She runs a little heavier now than she was built to.\nTheir own ship, the one they call home, is leaner — older wood, older scars, sails gone the soft grey of something that has outlived several storms.\nThe Oron, a majestic vessel, rose proudly from the water, its colossal oak timbers darkened to a midnight-charcoal hue by the application of burning pitch and whale oil over the years to preserve its hull from tropical conditions. Unlike the pristine naval ships, her wood was scarred by grape-shot, jaggedly patched, and adorned with an ominous, sprawling sterncastle that looked more like a floating gothic fortress than a vessel.\nThree towering masts stretched toward the sky, carrying vast clouds of ink-dyed, tattered canvas. When the wind caught them, the sails let its full breadth, casting a massive, terrifying shadow across the water long before the ship itself could be clearly seen. Neither ship looks like it belongs to men the crown would call anything but pirates.\nThe clouds have stayed away today. The wind drags hard at the sails despite it, the water glittering under a sun that beats down mercilessly on the deck. The crew moves with purpose, their eyes fixed on the horizon as they prepare for whatever lies ahead. The captain lets the wheel drift a little under his hands, playing it against waves too gentle to need the correction, muttering something to himself that only the wind gets to hear.\n\"I see you\"\n\nHe asks Rye for rum.\nHe always asks for rum or whiskey.\nThe captain cannot go three hours without something burning in his blood — and if he does, if the hours stretch too far past three, something in him changes. Drunk men slur and stumble and eventually sleep. What takes the captain in those hours looks more like something wearing him from the inside, testing the fit. At night they lock him in his quarters — not for his safety, though the crew tells itself that's the reason. The doors are airtight, packed and sealed, built to keep the sound in rather than anything out. None of the crew has ever heard what happens behind them. To Rye, the captain has simply always screamed in his sleep, the way some men simply always snore.\nThree, four, or maybe five of the old hands remember further back than that — remember a version of the captain who slept quiet as a stone. They know that whatever started the screaming and the missing eye arrived in the same breath. The last man foolish enough to ask disappeared into the howling of a storm not three winters past.\nThe leviathan isn't real.\nEveryone agrees on that. It's simply easier — kinder, even — to let the beast take the blame that belongs to their captain. Simply easier to sing the shanties a little louder those nights, drink a little deeper, and let him say his one strange line into the lantern-light — don't peer too deep into the unknown, the leviathan is watching — without asking him what he means by it.\nTake Chef Tartly, for one. He's known the captain since they were both too young to grow the beards they wear now, and in all that time he has never once let himself wonder, out loud or otherwise, how a man has an eye one day and loses an eye like it was never there the next.\nSome questions, everyone aboard has learned, are worth exactly what they cost to ask.\n\n**The Past**\nThe sky bruises to a deep, unnatural violet as the storm sweeps over the horizon.\nThe Oron groans under it—every timber, every joint, complaining—as the young captain hauls hand over hand on a line gone slick with rain and salt, bellowing with laughter. \"You best be using every fiber of your being,\" he roars to his crew scrambling on deck, and the wind eats half the sentence before it reaches anyone, \"or else the leviathan is going to take you away, mates! We're making it out of this one alive — and with stories to tell! YOU UNDERSTAND ME? HA HA HA HA!\"\nThe waves do not answer him. Tonight they tower instead, black walls with white teeth along their crests, tall enough to swallow the mast twice over, and the ship climbs them. Visibility dies at three meters.\nCurdled mist\nBeyond that there is only sound—the thunder overhead, and beneath it, threading through it, the thin, desperate shouting of men.\nThe captain grins into weather that would put older, wiser men on their knees; he has no fear.\n\"Andreas!\" He's still hauling, forearms burning, eyes stinging with rain that tastes like the whole ocean at once. \"Find that bloody chef! He's got the strength to hold this line while I fight the wheel!\"\n\"Aye, Captain!\" Andreas is gone before the sentence finishes, swallowed by the black stairwell down to the crew deck, and for one long moment the captain is alone at the rail with nothing but the storm and his own laughter for company.\nThat is when he sees it.\nThere, at the very edge of the three meters the world has allowed him, standing where no man could stand—upon the water itself, upright, untroubled by waves that would drown a whale—something tall. Something lanky, the way a shadow is lanky when it's cast by a light that shouldn't exist. It does not sway with the ship. It does not sway at all. The storm moves around it the way water moves around a rock, and for one heartbeat the captain's laughter catches somewhere behind his teeth and does not come back out.\n\"i see you.\"\n….\n\"Captain! Chef Tartly!\"\nHe turns. A man does not ignore his own first mate shouting a name into a hurricane, and when he looks back—half a second, maybe less—the water where the figure stood holds nothing but curdled mist and the churn of a wave already breaking.\nMist. Only mist, dressed up by a storm.\nHe tells himself that. Believes it mostly; he chooses to believe most things that let him keep living life. He throws himself back at the wheel, spins it hard to meet the next wave before it can meet him first, and when his hands are shaking—from the cold, he tells himself, it's only the cold—he pulls the little rusted flask from his sash and drinks deep.\n\"Ahhh.\" He wipes his mouth with the back of a hand gone white at the knuckle. \"I love the east for its strong taste of starch.\"\nAnd then he is still, again, still and precise; every motion is suddenly economical in a way it wasn't a minute ago—a man who has done this so many times his body no longer needs his mind. He breathes in salt until it burns, lets it burn, and puts the flask away. Occasions like this are the only occasions that earn it. A man needs his sea legs found quickly, and there is more than one way to find them.\n\"We don't die on the ocean!\" he bellows into the dark, to no one, to everyone. \"We *live* on it!\"\nThe storm, for its part, says nothing back.\n\n---\n\n**The Present**\nThe sun is still up when they eat—low and bronze at four in the afternoon, holding the sky. The sea tonight is calm. Not still; the sea is never still on this side of the world. But calm, carrying the ship forward.\nMashed potatoes and salmagundi. It's always this, the first night out—an old tradition, a favorite, built to bury the taste of meat gone a little too long in the barrel under enough salt and spice so that no man remembers its age and just bows their head in thanks and reverence. {{ Historical reference: “Salmagundi” was a historical dish associated with sailors and maritime communities, generally consisting of a mixture of meats, fish, vegetables, eggs, and other available ingredients. }}\nIn the mornings, the crew take their oranges, a small ritual against the scurvy.\nThe cold gets into a man's joints out here. The salt gets into the wood, the rope, and the wounds that never quite finish healing. Nobody aboard remembers, anymore, what warmth used to feel like.The port they call home is always covered in clouds; it's cold, but as sea fairs they are used to it.Home….\nThe captain strolls the deck before the evening meal. \"You missed a spot,\" he says to the cabin boy. \"You don't want Rye to chew you up now.\" Above him, Rye ought to be at the wheel or up the mast this late in a run—instead he's below, in the captain's own quarters, humming something tuneless, reading by a light he isn't strictly permitted to do this early.The cabin’s structural bones were heavy, ancient English oak, blackened by decades of salt air and tobacco smoke. However, every  rib and arched timber beam had been meticulously overlaid with beaten gold leaf, stripped from the altars of galleons. The gold was no longer pristine; it was aged and tarnished, flecked with green verdigris and chipped away in places where heavy iron cutlasses had scraped the low ceilings during rough seas. It glimmered greasy and dim under the swaying lantern light, casting a sickly, opulent glitter across the room. The captain lets him. Rye reads about the ocean and the things documented to live in it, real things with the ancient names and careful drawings, and if his childhood had gone even a little differently, he might have made a fine marine biologist instead of a fine pirate.He reads on the captain's fine desk, a massive, sprawling slab of scarred mahogany, heavy to not scrape the deck planks when the ship moves with the ocean. Its edges were trimmed in tarnished gold moulding, and its surface was deeply stained with spilled rum, black ink, and the dark, circular rings of heavy silver tankards.The captain told him once—not unkindly—that a man may joke about the unknown and the ancient creatures all he likes, so long as underneath the joking he stays a God-fearing man. Rye always laughs at that.\nAs the sun sets, lanterns light up one by one along the rail, resembling little orange stars in the twilight sky. Below decks, the crew gathers tightly, bowls full to the brim, voices mixing smoothly as they prepare for the evening's chatter. The captain stays for the songs. He always stays for the music.\nIt's the stories he can't sit through.\nSomeone always tells one—a cursed cove, a ship swallowed whole by fog, a voice calling a man's name from beneath black water in a voice that sounds exactly like his mother's.\nSplash\nThe men laugh, the way men laugh at things they've never once had real cause to fear. And every time, without fail, the captain finds a reason to leave before the story finds its ending. Tonight he goes back to his cabin with a bottle of whiskey, opens the one window that looks out over the water, and whistles along with a wind that has already started climbing toward something worse than a breeze.\nHe looks up for the north star out of habit and finds instead a sky already thickening with cloud where an hour ago there was none.The captain stands there, cold-faced, liquor tracking a slow line down his cheek, one hand rising without his permission to rest against the ruined socket in his head.\nHe goes to bed.Hecannot remember, some nights, what tired even feels like aanymore—butbecause it's the only thing left to do with a night like this one. He blows out the candle, catches his own reflection for half a second in the black glass of the window before he turns from it, and lies down into the dark.\n\n---\n\n*The dream.*\nHe is standing on the ocean. Not sinking, the water beneath his boots is glass-still, not a single wave disturbing it in any direction, as though the sea itself is holding its breath.\nSomething is standing with him. Distant. Small enough to almost be nothing.\n\"I'M NOT AFRAID OF YOU!\" The words tear out of him before he's decided to say them. \"I KNOW WHAT YOU ARE! I KNOW WHERE YOU COME FROM! YOU MAY HAVE TAKEN IT! — BUT YOU WILL NEVER TAKE AWAY MY HOPE!\"\nThe ocean swells, all at once, from every direction, water climbing itself in defiance of every law it's ever obeyed, and the figure grows with it—taller, lankier, until it is not a figure standing on the water, but the water itself. Thunder answers next, one strike and then a second, and in the white tear of lightning between them the captain sees it.\nIt is not one shape.In the half-second the light allowed him to see, it was somehow everything at once. Colossal, filling the wave that towers above him, and yet impossibly, unbearably close, its face inches from his own. Not a face. A suggestion of one, features that arrive and dissolve and arrive again slightly wrong, eyes that are not eyes with something moving far down inside them, patient, unbothered, and ancient in a way that has nothing to do with years. And beneath it, around it, inside the sound of the thunder itself, a hundred thousand men are drowning, screaming for a surface they will never reach, a chorus with no mouths behind it.\n\n\"NoooOoo—\" The word breaks apart in his throat. \"NOooooooO, not now, it's too early—stay away from me—noooOOOOO!\"\nHe is screaming in his sleep. Truly screaming, the sound tearing raw against the sealed wood of his own cabin walls, no one hears him—not over the boarded quarters, not over the party still going soft and warm beneath the deck below, men who have no idea their captain is dying a small death every single night while they sing.\n*\"I see you.\"*\n\nHe wakes.\nCold sweat, heart slamming, the one eye he has left blown wide and dilated in the dark. He looks around the room in every direction at once and finds—nothing. No one. Just his own cabin, his own bed, the window shut tight against a wind that has, for now, stopped its howling.\nHe sits up. Breathes. Forces the air in and out of himself, and when he finally looks up, his eye stares—the way it always does, the way it will keep staring for the rest of his life—to the chest on the far side of the room.\nHe does not open it. Not tonight. But he does not look away from it, either, not for a long while.\n\n---\n\nBelowdecks, the songs are winding down into yawns and half-finished verses. Rye sends the crew to their hammocks and picks five men for watch—a small mercy, letting them draw lots rather than volunteer. He could have taken command of *The Harvest* instead, years ago, when the offer was made. He stayed. Close enough to calm the captain if the man's mad ravings ever finally tip him all the way over.He has hope to one day alleviate the captain and calm his insanity.\nThe five men on watch move in pairs of light—small lantern-glow bubbles drifting across the dark deck, careful not to wake the men sleeping below. Above them, in Chef Tartly's cramped quarters, Rye sits across from the one man aboard who might actually tell him the truth if asked.\n\"Tartly. What's your read on this.\" Rye doesn't quite make it a question. \"Even if that island's real — do we have enough rations for the reach?\"\n\"Two months, at sea.\" Tartly does not look up; he is focused not on the conversation, but on the chess board below.The two captains' sides are playing chess with one another; they are the most literate on the ship, which doesn't seem like much living among a bunch of cut throats and pirates, but they enjoy each other's company and keep their minds sharp. \"But if we don't find it, and we have to turn back for land instead, we might not make it back at all.\" Tartly makes his move intently, his king and rook, castling , long side.\nA pause neither man wants to be the one to end.\n\"Tell me you still trust him,\" Rye says, finally, and something in his chest tightens as he says it. Rye proceeds to move the bishop, \"check.\"\n\"I trust he wants what's best for us.\" It comes out steadier than Rye expected. \"What about you?\"\nTartly looks at him. Cold, level, honest. Tartly moves his king out of the way.\n\"I don't know what to think anymore.\" As Rye proceeds to diagonally take the castle with his queen. \"Checkmate.\"\n\n---\n\nUp on deck, one of the five watchmen turns from the rail and finds the captain already looking at him.\n\"Woah — Captain.\" A short, relieved laugh, more nerves than humor. \"You gave me a fright there. Thought you were the leviathan for a second, ha.\"\nThe captain says nothing for a moment. Just looks at him  — before the laugh finally comes, a beat too late, a half-tone too flat.\n\"Ha. Well.\" His voice is calm. Almost gentle. \"Best be careful up here, all the same. I may as well have been. And if I had — you'd have disappeared before you ever knew to be afraid.\"\nThe crewman laughs again, easier this time, and turns back to the water.\nBefore the man's smile fades completely, the captain's black blade strikes, swift and merciless.\nThe man screams in pure shock and pain , \" Captain!!!!\" as the captain pushes him off the deck.\nSplash\nThe dark swallows it whole.\nBy the time the other four watchmen reach the sound of it, there is nothing left to find but a smear of crimson across pale planking, and a scream still hanging in the air with nowhere left to land. The cremates take notice and raise their guard.\nFor a moment, nothing. The ship keeps its heading, the sails keep their shape, and the sea keeps its rhythm, as though the ocean itself hasn't yet decided whether to acknowledge what just happened.\nThen the shouting starts.\n\"Man overboard!\" someone yells, although that's not quite right since a man overboard implies a guy who has fallen, and the men closest to the rail are already retreating away from it, their hands halfway to the blades. *Captain*.\nThere is no indication of the guy in the water, except the wet print of a boot heel and blood.\nThree of the four watchmen draw their cutlasses in the same breath, a single motion passed between them like something rehearsed. The fourth runs toward the one door on this ship that has always felt safer to knock on than the captain's cabin.\n\"Tartly.\" His fist pounded into the wood. Tartly yells, \"What is it? What's wrong? C'mon, spit it out—\"\n\"A man went over,\" he says. \"Screaming 'Captain' while he did it. There's blood where he stood and no man standing in it, sir.\"\nTartly's face does not do what a face is supposed to do with news like that.\n\"Gather the four that are left,\" Rye says, at the back of Tartly's room. \"Someone's turned tail on us; that's all this is. A coward with a grudge doesn't stay to finish the job once he's started it—he won't try his luck against the four of you together. We'll settle this properly and be back in our hammocks before the hour's out.\"\nTartly's door creaks as it slowly closes behind him in the dimly lit passage, the old wooden floor pressing against the wet door.\nThe four remaining watchmen line up along the rail, none of them looking at each other, all of them having heard and seen the exact same thing. No one needs to say what conclusion that leaves them with.\n\"You think it was the captain,\" one of them says. Not a question.He leaves it with a dull silence before Rye ignores his own thoughts betraying him.\nRye gazes towards the captain's cabin, the most visible room on the ship, illuminated by lantern light with its door shut and enveloped in an eerie silence, refusing to let the unsettling thought fully materialize.\n\"Did any of you see him leave those quarters?\" A pause, long enough to let the silence answer for them. \"No. Because he didn't. So we won't be stupid about this. Daggers out — mine first.\" He draws his own and holds it flat across his palm, clean steel catching lantern light. \"Then every other blade. Every blade on this ship is examined tonight, silently, without disturbing anyone who does not need to be disturbed, and we discover which blades have a dirty edge. Maybe we'll get lucky and the killer hasn't dumped their blade in the ocean.\"\nThey do it through the small hours, hammock to hammock, careful hands lifting sheathed steel just far enough to check and no farther. No blood on any blade that isn't already rusted with old blood. No man missing from his bed who shouldn't be. By the time the horizon starts bruising grey in the east, Rye has worked through every explanation a first mate is willing to consider—a drunk settling an old score, a stowaway never found in the hold, some private cruelty that had nothing to do with the captain, and a thrown murder weapon over the side sooner than be caught holding it. It could be anyone of them.\nThe captain emerges as the sun clears the water fully, and listens to Rye's account with his one eye fixed somewhere past Rye's shoulder — the horizon, or nothing.\n\"Don't trouble yourself over it further,\" he says, when Rye finishes. \"It was the leviathan. Let that be the end of the matter.\"\nRye's fist closes at his side before he can stop it. It isn't the answer of a sane man, and this time the crew won't let it die quietly in a bottle of rum and a louder shanty. Word has already crossed the ship — *the captain killed him,* they say, and stop saying it the moment his shadow falls across the deck, and look at their own hands instead of his face. Something in it has started to feel less like fear and more like men working up the nerve to call it justice.\nClouds that weren't forming an hour ago begin to form overhead, thickening into a gloomy gray hue.\n\n---\n\n**The Past**\nThe captain sits in his quarters with a cup of Earl Grey, extra milk, no sugar, and gone lukewarm at his elbow. Charts and maps lie spread out under the lantern light. Beyond the window the sky is strewn end to end with stars.\nThe whisper arrives before anything else does.\n*\"I see you.\"*\nA feeling settles into his bones, something that gets under the ribs and sits there uninvited, and he finds himself sitting up straighter, gripping the cup tighter.\n\nIt is already in the room by the time it lets itself be noticed. Watching him from an angle no standing man could occupy—up and to the left of him, and somehow behind the wall as much as in front of it, as though it had come up out of the water and brought none of the water's manners with it. It doesn't want him to see it yet. Not properly. So he doesn't. But something older in him answers anyway, some part of a man that used to be an animal before it learned to stand upright, leaning toward it the way a body leans away from a ledge before the legs have agreed to move.\nThe gold in the room reacts more plainly. The mirror's edging. The iron banding on the sea chest. The loose coin was scattered across the corner of the desk. All of it wakes at once—a low glow, the particular colour metal turns when it remembers scorching heat—and the shadows in every corner of the cabin deepen.\nOne candle gutters.\nTwo.\nThree\nand no draft in the room to blame for any of it.\nFour\nFive\nThe glass in the window starts to shiver, shudder, shudder, shudder , shudder, small and steady, and it starts speeding up with ferocity. SHudder, SHUDer, SHUDDER.\n\nPA!\n\nThe captain stands. Sets the tea down and stomps one boot hard against the floorboards.Just a man checking whether the floor beneath him is still a floor.Checking if his own mind is still the one he left it as this morning.\nIt stops.\nAll of it, together—the glow, the cold, the candles mid-collapse—gone in the same instant, and by the time he's turned fully around, there is nothing behind him but his own shadow, long and unremarkable, across a floor that has, apparently, decided to remain a floor.\nHe doesn't write it down. Doesn't mention it to Andreas, or to Tartly, the tea gone ice cold at his elbow. He finishes his charts. Blows out what's left of the candles.\n\n---\n\n**The Present**\nThe heavy, curdled mist comes; it's a dark Sunday evening, and every man aboard feels it settle into him. Something different arises within them; they are pirates, hateful, greedy, and revenge-stricken.\nSplash\nThree meters of visibility. Beyond that, only the sound of water against timber and the occasional groan of the men finding their own way in the dark.\n\"Dead water, a full day now,\" Rye says, mostly to himself, and to the deck boy scrubbing beside him—fourteen years old, easy to keep close, easier still to keep alive if Rye simply never lets him drift far. \"Not a single fish. Something's scared the life clean out of this water.\"\nSomewhere inside that mist, a man walks with a cutlass.\nCurdled mist, the man walks as if there were no mist.\nBlood. Then the clash of steel meeting steel.Sparks, then a scream in the curdled mist—Captain. *Tartly. How could you*?!\nSplash\n…\nRye does not run toward the sounds, and he holds his ground instead, sword drawn, eyes doing the work, muscles at the ready.He calls to his men through the grey—stay *guarded, does anyone see the captain, where in God's name is Tartly*—Their voices climbing toward the particular pitch of men who have started to suspect that guardedness alone will not be enough.They start arguing with the mist , with their friends , with their chef, they start questioning the captain but in a louder voice concealed by the fog.\nThe last anyone saw of the captain was in his cabin, charts spread, mapping a coastline that does not exist on any chart he owns. And that is precisely where he still is ….\n\n…… He bursts out in anger … flipping the table, papers scattering across the boards, one fist coming down against the wood, and he splits his knuckle against the table.\n\"Where,\"\n\"Where is that damned island?\"\n\"WHERE\"\n\"WHERE\"\n\"AAAARGH\"\n\nSplash\nHe crosses to the sea chest. The golden knife inside glows, greasy and alive. He grabs the knife and walks over to the floor where the table flipped over. He grabs a golden platter used for fine dining in royal ships. He had stolen it years ago from an admiral's dinner service aboard the very ship that would later become The Harvest—he had kept it because a man deserves one small vanity while drinking rum. The moment his hand closes around the knife, the fog just beyond the window thins by a small degree; he is undisturbed by this. His eye dilates.\nOutside, on deck, a man is waiting for him—one of his own crew, cutlass already drawn.\nThe captain looks at him. Does not use his voice.The man attacks the captain wild and unpracticed, and the captain—steel against steel, ordinary cutlass against ordinary flesh, nothing golden spent on a man who does not deserve the honor.\n\n\"I'm sorry,\" he tells him, close enough to pass for tenderness. \"I'm trying to save us. May the ocean carry you home, my friend.\"\nSplash\nHe lets him go over the rail without ceremony and climbs the narrow stair behind his own cabin to the stern. There, with the fog pressing in on every side, he strikes the golden knife once against the stolen gold plate—a single, low, resonant note—and the mist peels back from the ship the way skin peels back from a wound.\nHe is back inside his cabin before anyone thinks to ask what the sound was, the knife already wrapped and buried, the plate stowed beneath it.\nRye, still on guard, watches the fog lift. There are too few heads on deck for what started this journey.\nTartly reaches him before his thoughts can finish the sentence, face carrying something Rye has never once seen on it in all the years they've shared a ship.\n\"Rye. It's gone. All of it.\" A breath, unsteady, entirely unlike him. \"The food. The whole pantry was empty, and I was standing not thirty feet from it when the mist came down.\"\nRye turns to the deck—what's left of it—and raises his voice loud enough to reach every man still holding a blade too tight in his own two hands.\n\"Nobody lets the ocean's mad ravings do their thinking for them tonight!\" It isn't calm, not really, but it's close enough to pass. \"We've got a killer aboard, and whoever it is needs feeding the same as the rest of us, so the food is somewhere on this ship, and we *will* find it. Groups of three, no fewer. We make for the nearest sighting of land and settle the rest there. Understood?\"\nSilence answers him, which is as close to agreement he will get, and the men holster their steel in twos and threes and begin sorting themselves into groups. Rye keeps Tartly and the deck boy close. The captain keeps himself alone, behind a door Rye finally works up the nerve to knock on.\n\"Come in, Rye,\" the voice says, before the knock has even finished landing.\n\n---\n\n**The Past**\nBelow deck, laughing loud enough to carry over a dozen conversations at once, telling a story with his hands as much as his mouth, surrounded by faces that time will eventually take. Tartly is younger here too, and louder for it. The hold still smells of the plunder they're carrying home—gold and silver and stones lifted from the ruined edges of the great marble city, Grean, more wealth on this ship than half the crew has ever imagined owning.\nThey're on their way to a hidden harbor near Inglis, the clouded country where the King hunts them down, gray and unglamorous but entirely and gloriously their home.\nNear the end of the night, when the songs have started running thin, the captain calls for quiet and opens an old leather-bound book to a page gone soft from handling. \"Canst thou draw out Leviathan with a hook? Or his tongue with a cord which thou lettest down? Canst thou put a hook into his nose? Or bore his jaw through with a thorn? Will he make many supplications unto thee? Will he speak soft words unto thee? Will he make a covenant with thee? Wilt thou take him for a servant for ever? Wilt thou play with him as with a bird? Or wilt thou bind him for thy maidens? Shall the companions make a banquet of him? Shall they part him among the merchants? Canst thou fill his skin with barbed irons? Or his head with fish spears? Lay thy hand upon him, Remember the battle; do no more. Behold, the hope of him is in vain: Shall not one be cast down even at the sight of him? None is so fierce as to dare stir him up: who then is able to stand before me?\" {{ Biblical reference: Job 41:1–10, King James Version. The passage is Job's description of Leviathan and God's declaration of its overwhelming power. }}\nA figure at the far end of the long table. Perfectly still, in a room where nothing else has managed to be.\nHe blinks. It's gone.\n\"Monsters don't exist, men,\" he says, and if his voice catches at all on the way out, no one at that table is drunk enough yet to notice. \"Those Grean folk in the city of marble, they talk of men turned to demons and old gods haunting honest sailors—pay it no mind. Our God allows no such thing of power over us. We are safe. It's by his grace alone we've made it home with a hold full of another man's riches, and I'll not have that grace insulted by fireside talk of monsters in the water. The only leviathan a follower of the ocean's god need ever fear is the ocean herself, and she's carried us kindly enough tonight.\"\nThe men bow their heads and lift their cups, and if a few of them exchange a look that says they've heard this particular reassurance delivered with slightly too much conviction, none of them says so.\n\"Five of you on watch tonight,\" the captain says, standing, already reaching for the next bottle. \"Volunteer or draw lots, I don't much care which—only that it's done.\"\nAndreas watches his captain cup in hand.\n\n---\n\n**The Present**\nRye walks into the captain's quarters as the door slams shut behind him.\n\"I know what you're going to say.\" The captain doesn't wait for him to say it. \"I know you're doubting me as captain of this ship. We've lost men, our food's gone, but Rye—my boy—listen. I can *feel* it. We're close. There's no sense turning back now.\"\n\"Captain,\" Rye says gently.\"This has gone too far. The men are fed up. Tired. Losing what little trust they had left—and it's because I've spent every day of this voyage speaking up for you, and I can't keep doing it, not without both of us ending up called mad by every sailor from here to the harbor. I'm not crazy, Captain.\" A breath. \"But I think you're reaching the edge of your own mind. You've never been like this on any run before. Why now? What's happening to you? Why won't you just *tell* me?\"\nThe captain looks past him, toward the black window and the ocean beyond it. \"You wouldn't understand, Rye. Stare at the water as long as I have, and eventually the water starts staring back.\"A pause, almost gentle. \"You'll simply have to trust me a little longer. Look—the clouds have thickened since the mist rolled through. Wind's rising. Let's see this storm through first, and then—\"\nRye doesn't wait for the rest of it. He crosses to the door, opens it without asking, and lets Tartly in behind him.\n\"Captain.\" His voice doesn't shake, though something underneath it clearly wants to. \"I, Rye, first mate of this ship, am declaring you unfit to continue this voyage. You'll be confined to your cabin, under Tartly's watch, until we're clear of this storm—after which I intend to turn us around and take us home or to the nearest port we can find.\"\nThe look the captain gives him has no forgiveness anywhere in it.\n\"You don't know what you're doing, lad. You'll doom us all.\" He turns that same look on Tartly instead, softer, almost pleading. \"You have to listen to me—\"\nRye is already walking out, already shutting the door on the rest of the sentence, already calling the crew to storm stations before the latch has fully caught. Outside, the wind picks up its argument with the sails. Inside, alone now with only Tartly for company, the captain begins throwing whatever his hands can find—a chair, a mug, the ruin of his own charts—and somewhere underneath the noise of it, he's begging.\n\"Tartly. You know as well as I do what happens now. Don't do this. Don't—\" His voice cracks clean in half. \"No. *No.* You're not Tartly. Stay back. Stay *back*—\"\nTartly unfolds his arms.\n\"I SEE\"\n\"YOU\"\nThe smile that follows has too many teeth in it, and the skin around that smile has already begun, very quietly, to come away from whatever's underneath.\nThe captain throws himself at the sea chest, hands finding the golden knife by memory alone, and holds it out in front of him.\n\n---\n\n**The Past**\n\nThe two ships are running for home, the cargo hold is heavy, and the young captain sits alone in his quarters going through the count of it by lantern light—coin, jewel, and a few odd pieces too fine to have belonged to anyone but a man who could no longer object to their loss. Among it, a knife of gold he doesn't remember taking, though he must have, because here it is, warm in his hand.\nLightning splits the sky outside like something tearing itself open on purpose. The candles go out—all of them, together, though there isn't a draft in the room.\nSomething is standing in the corner.\nHe catches it only by accident, only in the brief gold-lit flicker off the blade in his own hand, and the thing recoils before it comes at him instead, fast, hands reaching for his face with fingers gone too long and sharp.\nHe stabs it because there is nothing else left to do with the half-second he's been given.\nIt screams—a sound that seems to come from several directions inside the same throat—and something dark pours from the wound where an ordinary man would bleed red, and beneath that dark something else shows itself for a moment, black and lit from within by a light that has no source. As the thing within rips open the skin it's been hiding under.\nThe captain's eye disappears while he's still looking at it. No pain. No blood. He screams—not from the wound, because there is nothing there yet to call a wound, but from the fear, the fact of losing something with no mechanism attached to the loss.\nThe figure, wounded, folds in on its own side, drawing its ruined skin back together with long fingers, stitching itself whole again while it howls through something that isn't quite a mouth, and then it simply comes apart—not fleeing so much as returning, draining down between the floorboards the way water finds its way back to water.\nThe captain faints.\n\n---\n\n**The Present**\nThe storm has stopped pretending to be weather and started behaving like something with intent. Rye is up in the rigging fighting a sail before the lightning can strike the flammable canvas, and when he looks back over his shoulder for The Harvest's running lights, he finds only black water where a hundred-and-ten-foot frigate ought to be.\nNo wreckage. No debris riding the swell that couldn't just as easily be storm-wrack from his own ship. No sound that could have told him when or how she went.\n*He shakes it off;* there's a sail to cut loose and no time left to spend on looking around.\nBelow him, the crew is coming apart in a different way. A cutlass drawn, a man screaming that he knows who killed his friend, and gutting the man,\nSplash\nBefore three more blades answer the accusation, the whole deck folds into violence. Rye watches from the ropes and reaches, for the first time all voyage, the only conclusion that still makes any sense to him: *my crew has mutinied. My captain has lost his mind. This ship is finished.* He climbs down the far side of the rigging, slow and unseen, and makes for the cabin instead of the fight.Unseen.\nInside, the dark is total. The captain backs away from something only he can see, hurling a chair, a mug, whatever his hands find, and the golden knife out in front of him like the last true thing he owns. A dropped candle catches the boards. Fire climbs fast , and still the figure only stands there, smiling wider, watching him burn his own ship down around them both.\n\"I see you.\"\nThe door slams open. Rye—sword drawn, soot already on his face from the smoke filling the passage behind him.\n\"Captain. Tartly.\" The figure turns to look at him and is, to Rye's eyes, simply Tartly—good old Chef Tartly, exactly as he's always been. \"We need the dinghy. Now. The ship's burning, the crew's turned on itself, and I know a dinghy's no proper answer to a storm like this, but it's the only one left to us.It's better than going down on a burning ship.\"\n*Tartly* crosses the burning room and takes hold of the captain with a strength that bends the rules of what a man that size should be capable of, and the captain fights him the entire way—flailing, screaming for help that isn't coming—until Rye stuffs cloth into his mouth and binds his wrists and ankles rather than lose him overboard to his own thrashing.\nGetting the three of them off the ship costs blood.\nSplash\nCrewmen who've already decided the captain is to blame for everything—the deaths, the mutiny, the Harvest, all of it—throw themselves in the way, and Tartly fights through some of them and simply doesn't notice others.They lower the dinghy into water that takes it the moment it touches, flinging it hard against the Oron's burning hull before the current decides which direction to drag it in instead.\nRye holds the captain down against the floor of the little boat, tears cutting clean lines through the soot on his face, and screams the only accusation he has left in him.\n\"CAPTAIN, JUST *CALM* DOWN—I NEEDED YOU! AND YOU COULDN'T EVEN STAY SANE FOR ME! NOW THE HARVEST'S GONE, THE ORON'S GOING DOWN WITH HER, AND ALL YOU CAN TALK ABOUT IS SOME DAMNED LEVIATHAN!\"\nBehind them, fire and water fight over what's left of the Oron, and the water wins, slow and total, timber hissing under the waves until there's nothing left above the surface to argue about. The storm, extraordinarily, chooses that exact moment to fall still—not fade, not ease, but stop, all at once.\nThe captain goes limp in Rye's grip. Not sleep. Not quite unconsciousness, either—something closer to surrender.\nThree men, one small boat, and an ocean gone unnervingly calm around them. Rye finds a wooden plank from the wreckage of the Oron, a hard heel of bread someone had the good sense to grab on the way out, and a fishing line he doesn't remember taking. He starts rowing toward a direction that is not a destination so much as a refusal to stay still.\nBehind his closed eye, the captain has already gone somewhere else entirely.\n\n**The Dream**\nHe is on land.\nThe harbor smells the way it always has—brine and tar and woodsmoke, fish guts drying on the flat stones, a smell he'd know blind from a hundred miles out. Stallholders call to him by name, not by title, pressing hard biscuit and salted fish into a sack he doesn't remember carrying, refusing his coin the way old friends refuse coin from a man they've missed. *Welcome home, Captain. Good to see you standing.* He walks deeper into the town, past the chandler's, past the church with its bell gone green, greeting faces he hasn't seen since before the eye—and above him, for the first time in longer than he can count, the clouds pull apart. Five minutes of sun. Maybe less. He tips his face up into it anyway, the way a man drinks water he isn't sure he'll get again.\nOutside the old harbor tavern, at the same table he always claimed as his own, sits Andreas—the Andreas who stayed behind this time, who chose the safer run, who is old now in a way the captain somehow isn't. A tankard in front of him. A seat pulled out, waiting, as though he's known the captain was coming.\nThe captain starts toward him.\n—\nHe wakes gasping, lungs dragging air like a man surfacing from something that didn't want to let him up.\nThe dinghy rocks beneath him. Salt. Wood. The particular ache of a body that has been lying wrong for too long.\n\"Rye.\" His voice comes out cracked, unused. \"Rye—where's my gold knife?\"\nRye doesn't answer. Doesn't look at him, not properly—just a glance, quick and unreadable, before his eyes go back to the water.\nThe captain turns instead to Tartly, bracing for something he doesn't have a name for, and finds only Tartly. Just Tartly. Tired, soot-streaked, entirely and blessedly himself.\nThe breath goes out of him in one long shudder of relief.\nThe dinghy drifts. No sail, no oar in use, no sense of direction—just the small boat and the fog and the two men in it who won't quite meet his eye.\n\"Captain…\" Rye starts. Stops. Starts again, the way a man starts a sentence he's already regretting. \"Captain, I—\"\n\"Rye, my boy.\"The captain reaches for him, some old instinct toward comfort, toward fixing. \"I tried to save us.\"\n\"Captain.\" Rye's voice doesn't rise. If anything, it goes quieter, quiet enough that the captain has to lean in to catch it at all.\n\"We're already dead.\"\nThe fog moves.\nNot with wind, but the way it moved in his cabin, in his dream, in every place this year has taught him to fear stillness. It rolls in low across the water and climbs the sides of the dinghy, and the two men sitting across from him begin, very gently, to come apart at the edges*.* Wounds bloom through Rye's shirt where there were no wounds a moment ago—dark, wet, three of them, low in the chest—and Tartly's collar is soaked through with a red that has clearly been there for hours and has simply been waiting for the captain's eye to catch up to it.\nThere is a knife in the captain's hand.\nHe doesn't remember picking it up.\n\"Noooo—\" The word tears loose from somewhere below thought. \"My boy— NO—NOOOOOO—\"\nHe throws the knife. Doesn't watch it land, doesn't hear the splash it must make—he's already reaching for Rye, gathering him up out of the bottom of the boat, and Rye is so much lighter than a man should be, lighter than a man who fought a mutiny and a fire and a storm to get them this far, and the tears come before the captain can stop them, falling onto a face that no longer moves to acknowledge it.\nHe lowers Rye into the water first. Then, Tartly, beside him, the two of them drifted apart the moment the sea took their weight.\n\"May the ocean—\" His voice breaks clean across the middle of the word. He forces it back together. \"May the ocean carry you home. May the gods bless you both, and let your souls be at ease.\"\nHe pushes them under. Watches until there's nothing left to watch.\n\n---\n\nAlone.\nHe is alone on the water, with no crew, no first mate, and no old friend at his side to tell him whether any of this is real. Days pass, the fog offering no sun to count them by, no stars at night to argue the point. He eats what's left of the bread in crumbs, rationing them smaller than a man should have to. The fishing line goes out again and again and comes back holding nothing. The ocean, for the first time in his life, has stopped answering him at all.\nThe fog is too thick to paddle toward anything in particular. He paddles anyway.\nThen—wood. Pale and long, cutting straight through the grey where nothing should cut straight. A dock.\nHe doesn't decide to move. His arms decide for him, tearing at the water, the dinghy lurching forward faster than his strength should allow, one word breaking out of him over and over, raw and small—\n*Home. Home. Home.*\nHe reaches it. Hauls himself up onto planking gone soft and grey with age, stands on legs that don't quite trust the ground beneath them, and lets the tears finally come freely, salt on salt, his whole body shaking with something too large to be only relief.\n\n*\"I see you.\"*\nHe looks up.\nIt is standing at the end of the dock. Tall, lanky in a way no bone structure should allow. There is no describing its face, not because the eye refuses to look but because there is nothing there arranged the way a face arranges itself.\nThe captain's eye, his remaining eye, is simply gone before he understands he's lost it. No pain. No warning. One moment's sight, and then only the socket, empty, matching the one that's been empty for years.\nHe turns. Runs — stumbling, blind now in truth as much as he has ever been blind in metaphor, back toward the only shape he can still remember the location of, the boat, because there is nowhere else on this dock, in this fog, in this entire drowned corner of the world, left to run to.\n\nIt catches him at the water's edge, one long hand closing on him and driving him down into the dinghy hard enough to knock the last air from his chest, and with a single motion — unhurried, almost gentle, the way a man pushes a door shut rather than slams it — it sends the boat out. Away from the dock. Away from land. Away from home, which was never going to be there for him anyway.Out into the deep blue ocean.\nChains rise out of the water.\nNot iron, something pale and wet and faintly glowing along their length, and they wrap the dinghy and wrap the captain in the same reaching motion, indifferent to the difference between the two.\nThey pull.\nDown.\nThe water closes over him without a sound, and the dark down here is total, older than any dark he has ever screamed into aboard the Oron, and somewhere in it—vast, patient, filling more of the black than the black should have room for—an eye opens.\nIt's been waiting exactly this long.\nIt looks at him in the same way that the ocean has always looked at him, ever since he was little enough to believe he was the one observing.\nAnd then it doesn't look away.\n",

]</script>

    "title": "The Cogwheel",
    "tag": "Fable",
    "content": "In the vast kingdom, where beauty rivalled the morning dew and opulence mirrored the splendour of Olympus, a dark secret lurked. Deep within the dungeons reserved for the most sinister criminals, a lone prisoner endured perpetual darkness and isolation. Enclosed by unyielding bricks and a soundless cell door, his only companion was a solitary cogwheel positioned at the room's center.\n\nEach day, the prisoner adhered to the king's mandated ritual: a meal, water, and a vial filled with an enigmatic potion. Reluctantly, he consumed these provisions, triggering a transformation in the once-inert cogwheel. As it came alive with clicks and whirrs, the guards perceived the prisoner as a mad soul, captivated by fanciful delusions. However, for him, each revolution of the wheel opened portals to realms beyond imagination.\n\nThe initial turn transported him to an idyllic meadow, bathed in golden hues beneath an eternal sun. The lush grass beneath his feet beckoned him to revel in the freedom that had long eluded him. Butterflies flitted about, casting colourful shadows on vibrant flowers—a haven of serenity resonating with the prisoner's forgotten desires for open spaces and the embrace of nature. It reminded the prisoner of the life he used to have as a servant in a stable.\n\nSubsequent turns ushered him into a mystical forest, where mushrooms surpassed the height of trees, and insects thrived in proportions akin to farm animals. The air buzzed with the symphony of chirping birds, and the scent of earth and foliage enveloped him, blurring the boundaries between reality and imagination. Each towering foliage invited introspection and wonder—a fantastical world that fueled the prisoner's curiosity. What other worlds could be seen? The possibilities are endless..\n\nAnother turn plunged him into the depths of the ocean, revealing an ethereal underwater realm. Surrounded by the tranquility of aquatic life, the prisoner marveled at the play of light filtering through the water. Vibrant coral reefs danced with myriad colours, and schools of fish painted liquid tapestries in ever-shifting currents. Despite initial apprehension, the prisoner found liberation in the weightlessness of this aquatic sanctuary. In realising that he could breathe underwater, he knew the seemingly untaxed use of the cogwheel—endless possibilities with no toll. The prisoner was astonished, almost in awe.\n\nThe cogwheel then transported him to the foot of a towering volcano, where the fiery sky hosted dragons and mythical creatures soaring through tumultuous clouds. The intense heat and molten rivers presented a stark contrast, evoking danger and exhilaration. Amidst roaring flames, the majesty of these mythical beings captivated the prisoner, their wings casting shadows on the turbulent landscapes below. The prisoner, truly astonished, exalted the King. \"How great a king must ye be? To cast such a power in a cell? Your divinity knows no bounds! All hail the King. Who was made to be, and who became! All hail the king! Testimony to God! The throne! All hail the throne befitting generations!\"\n\nThe final turn transported him to the grandeur of the king's throne room. Amid opulent surroundings, the prisoner's attempt to seek an audience revealed the harsh reality of time's inexorable march. Confused, the prisoner looks at himself — once youthful, he now stood aged beyond recognition, a testament to the ephemeral nature of life, juxtaposed against the king's seemingly eternal reign. The throne to which many generations exalted the generations before, and before that, but the King before even that. Each realm, with its unique blend of beauty, danger, and wonder, wove a tapestry of experiences that only served to serve the King. The cogwheel, a conduit between realms, carried the prisoner through landscapes that ignited him to the point of extinguishment. Now the remnants of the prisoner remain in reality inside the prison, where the guards knew him as a mad soul, but for the prisoner, his remnants are in the king's throne room, where the King knew nothing of him but he knew of the King.\n\nThe Immortal King."
