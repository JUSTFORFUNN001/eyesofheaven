<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eyes of Heaven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0b0c10;
    --bg-elev: #14161c;
    --bg-elev-2: #1b1e26;
    --border: #262a33;
    --text: #e9e7e0;
    --text-muted: #9a9ea8;
    --text-faint: #666b78;
    --accent: #c79a3f;
    --accent-dim: #8a6f2f;
    --accent-soft: rgba(199,154,63,0.14);
    --accent-text: #1a1408;
    --radius: 10px;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --prose-serif: 'Lora', Georgia, 'Times New Roman', serif;
    --prose-text: #93a7c9;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f4ee; --bg-elev: #ffffff; --bg-elev-2: #eeece4;
      --border: #ded9cc; --text: #1c1b17; --text-muted: #5c5a52;
      --text-faint: #8b8878; --accent: #a3771f; --accent-dim: #8a6518;
      --accent-soft: rgba(163,119,31,0.12); --accent-text: #fff8ea;
      --prose-text: #34506f;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: rgba(199,154,63,0.35); }

  #app {
    height: 100vh;
    height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }

  /* ================= INDEX (split shell) ================= */
  .shell {
    display: flex;
    height: 100%;
    width: 100%;
  }

  .side {
    flex: 0 0 380px;
    max-width: 380px;
    height: 100%;
    overflow-y: auto;
    padding: 28px 28px 32px;
    border-right: 1px solid var(--border);
    background:
      radial-gradient(140% 100% at 0% 0%, rgba(199,154,63,0.10), transparent 60%),
      var(--bg-elev);
    display: flex;
    flex-direction: column;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    color: var(--text-muted);
    margin-bottom: 22px;
    flex: 0 0 auto;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  .cover {
    width: 100%;
    max-width: 220px;
    aspect-ratio: 2 / 3;
    border-radius: 6px;
    border: 1px solid rgba(199,154,63,0.35);
    background: linear-gradient(160deg, #23262f 0%, #14161c 60%, #0b0c10 100%);
    box-shadow: 0 18px 40px -18px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin: 0 auto 22px;
  }
  .cover::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(199,154,63,0.25);
    border-radius: 3px;
  }
  .cover-mark {
    font-family: var(--serif);
    font-style: italic;
    font-size: 34px;
    color: var(--accent);
    letter-spacing: 1px;
  }

  .book-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 28px;
    text-align: center;
    margin: 0 0 6px;
    line-height: 1.15;
  }
  .book-byline {
    text-align: center;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 22px;
  }

  .side-actions { display: flex; gap: 10px; margin-bottom: 22px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 999px;
    border: 1px solid transparent;
    padding: 12px 18px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); flex: 1; }
  .btn-primary:hover { background: var(--accent-dim); }
  .btn-icon {
    width: 44px; flex: 0 0 44px; padding: 0; height: 44px;
    background: var(--bg-elev-2); border: 1px solid var(--border); color: var(--text);
  }
  .btn-icon:hover { border-color: var(--accent); color: var(--accent); }

  .synopsis-box {
    flex: 1 1 auto;
    overflow-y: auto;
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--text-muted);
    padding-right: 6px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }
  .synopsis-box p { margin: 0 0 1em; }

  .stories-promo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    padding: 14px 16px;
    margin-top: 18px;
    border: 1px solid var(--accent-dim);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .stories-promo:hover { border-color: var(--accent); background: rgba(199,154,63,0.22); }
  .stories-promo-icon {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-text);
  }
  .stories-promo-text { flex: 1 1 auto; min-width: 0; }
  .stories-promo-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .stories-promo-sub { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
  .stories-promo-arrow { flex: 0 0 auto; color: var(--accent); }

  .stories-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-muted);
  }
  .stories-link:hover { color: var(--accent); }
  .stories-link svg { flex: 0 0 auto; }

  .sound-btn {
    width: 42px; height: 42px; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 999px; color: var(--text-muted);
  }
  .sound-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sound-btn.on { color: var(--accent); border-color: var(--accent); }
  .audio-notice {
    display: none; position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    max-width: min(92vw, 460px); padding: 11px 16px; z-index: 1000;
    background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--accent); border-radius: 12px;
    font-size: 13px; line-height: 1.5; text-align: center;
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }

  .copyright-side {
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .main-panel {
    flex: 1 1 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
    flex-wrap: wrap;
  }
  .search-wrap {
    flex: 1 1 260px;
    position: relative;
  }
  .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }
  .search-wrap input {
    width: 100%;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 11px 14px 11px 40px;
    font-size: 14px;
    font-family: var(--sans);
  }
  .search-wrap input::placeholder { color: var(--text-faint); }
  .search-wrap input:focus { outline: none; border-color: var(--accent); }

  .tool-btn {
    width: 42px; height: 42px; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bg-elev-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-muted);
  }
  .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tool-btn.active { color: var(--accent); border-color: var(--accent); }

  .vol-select {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.4px;
  }

  .list-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 28px 40px;
  }

  .chapter-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 20px;
    margin: 10px 0;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-elev);
  }
  .chapter-card:hover { border-color: var(--accent); background: var(--accent-soft); }
  .chapter-card-left { min-width: 0; }
  .chapter-eyebrow {
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 4px;
  }
  .chapter-name {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chapter-tag {
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--text-faint);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
  }

  .empty-state { color: var(--text-muted); font-size: 14px; padding: 40px 4px; text-align: center; }

  /* ================= READER ================= */
  .reader-shell {
    height: 100%;
    overflow-y: auto;
  }
  .reader-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 24px 80px;
  }
  .reader-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 0;
    flex-wrap: wrap;
  }
  .reader-bar select {
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    max-width: 240px;
  }
  .nav-btn {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
  }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
  .spacer { flex: 1; }

  .chapter-head { text-align: center; padding: 20px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
  .chapter-head .vol { font-size: 12px; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 8px; }
  .chapter-head h1 { font-family: var(--serif); font-size: clamp(26px, 4vw, 34px); font-weight: 600; margin: 0 0 20px; }

  .prose { font-family: var(--prose-serif); font-size: 19px; line-height: 1.9; color: var(--prose-text); }
  .prose p { margin: 0 0 1.3em; }
  .prose strong { font-weight: 600; }
  .prose em { font-style: italic; }
  .prose .scene-break { text-align: center; color: var(--accent); margin: 2em 0; font-size: 15px; opacity: 0.8; }
  .about-art-section { margin-top: 44px; padding-top: 32px; border-top: 1px solid var(--border); }
  .about-art-heading { font-family: var(--serif); font-size: 24px; font-weight: 600; margin: 0 0 6px; color: var(--text); }
  .about-art-sub { font-family: var(--sans); font-size: 13px; color: var(--text-faint); margin: 0 0 20px; }
  .art-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .art-thumb {
    display: block; padding: 0; border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; background: var(--bg-elev); aspect-ratio: 1 / 1;
  }
  .art-thumb:hover { border-color: var(--accent); }
  .art-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art-empty { font-family: var(--sans); font-size: 13px; color: var(--text-faint); }

  .art-lightbox {
    position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.86);
    display: flex; align-items: center; justify-content: center; padding: 32px;
  }
  .art-lightbox figure { margin: 0; max-width: min(92vw, 820px); text-align: center; }
  .art-lightbox img { max-width: 100%; max-height: 78vh; border-radius: 6px; display: block; margin: 0 auto; }
  .art-lightbox figcaption { margin-top: 12px; font-family: var(--sans); font-size: 13px; color: #d9d9d9; }
  .art-lightbox-close {
    position: absolute; top: 18px; right: 22px; background: none; border: none;
    color: #fff; font-size: 32px; line-height: 1; padding: 4px 10px;
  }
  .art-lightbox-close:hover { color: var(--accent); }
  .reader-bar.bottom { border-top: 1px solid var(--border); margin-top: 40px; }
  .reader-copyright { text-align: center; font-size: 11px; color: var(--text-faint); padding: 28px 0 4px; }

  /* ---- inline annotations ---- */
  .annot-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    margin: 0 1px 0 3px;
    border: none;
    border-radius: 5px 5px 5px 0;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    line-height: 1;
    vertical-align: middle;
    transform: translateY(-4px);
    padding: 0;
  }
  .annot-icon:hover, .annot-icon.open { background: var(--accent); color: var(--accent-text); }
  .annot-tip-popup {
    position: fixed;
    max-width: 300px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.55;
    color: var(--text);
    box-shadow: 0 16px 36px -14px rgba(0,0,0,0.6);
    z-index: 50;
  }

  /* ---- inline chapter images ---- */
  .chapter-figure {
    margin: 1.6em 0;
    text-align: center;
  }
  .chapter-figure img {
    max-width: 100%;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .chapter-figure figcaption {
    margin-top: 8px;
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--text-faint);
    font-style: italic;
  }

  /* ================= responsive: stack on narrow screens ================= */
  @media (max-width: 760px) {
    #app { height: auto; overflow: visible; min-height: 100vh; min-height: 100dvh; }
    .shell { flex-direction: column; height: auto; }
    .side { flex: 0 0 auto; max-width: none; height: auto; overflow-y: visible; border-right: none; border-bottom: 1px solid var(--border); }
    .synopsis-box { max-height: 160px; }
    .main-panel { height: auto; }
    .list-scroll { overflow-y: visible; flex: none; }
    .reader-shell { height: auto; overflow-y: visible; }
  }

  /* ================= short stories (separate visual identity) ================= */
  .theme-stories {
    --bg: #0c0a10;
    --bg-elev: #171320;
    --bg-elev-2: #1f1a2b;
    --border: #2c2438;
    --text: #ece7f5;
    --text-muted: #a49bb8;
    --text-faint: #6e6480;
    --accent: #8f7bd6;
    --accent-dim: #6f5cae;
    --accent-soft: rgba(143,123,214,0.14);
    --accent-text: #100c1a;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --prose-serif: 'Lora', Georgia, serif;
    --prose-text: #c9bfe0;
  }
  @media (prefers-color-scheme: light) {
    .theme-stories:not([data-theme="dark"]) {
      --bg: #f6f2fb; --bg-elev: #ffffff; --bg-elev-2: #efe8f9;
      --border: #ddd0ef; --text: #211a30; --text-muted: #5f5474;
      --text-faint: #8d81a3; --accent: #6f4fc9; --accent-dim: #5b3fac;
      --accent-soft: rgba(111,79,201,0.12); --accent-text: #fbf8ff;
      --prose-text: #43326e;
    }
  }
  .stories-back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-muted);
    padding: 14px 28px 0;
  }
  .stories-back-link:hover { color: var(--accent); }
  .story-eyebrow {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-faint);
    text-align: center;
    padding: 24px 28px 0;
  }

  /* ================= admin ================= */
  .fab {
    position: fixed;
    right: 22px;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    z-index: 30;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 999px;
    padding: 14px 20px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 12px 28px -10px rgba(0,0,0,0.6);
  }
  .fab:hover { background: var(--accent-dim); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 40;
  }
  .modal { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 560px; padding: 24px; }
  .modal h3 { font-family: var(--serif); font-size: 20px; margin: 0 0 4px; }
  .modal p.hint { color: var(--text-faint); font-size: 13px; margin: 0 0 20px; line-height: 1.6; }
  .modal p.hint code { background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; color: var(--accent); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%; background: var(--bg-elev-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 10px 12px; font-family: var(--sans); font-size: 14px;
  }
  .field textarea { min-height: 220px; resize: vertical; font-family: var(--serif); font-size: 16px; line-height: 1.6; }
  .row2 { display: flex; gap: 12px; }
  .row2 .field { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .modal-status { font-size: 13px; color: var(--text-faint); margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>

<div id="app"></div>

<script type="application/json" id="chapters-data">[
  {
    "id": 1,
    "number": 1,
    "title": "Blood and Snow",
    "volume": "Volume 1",
    "content": "**The Village**\n\nIn the serene embrace of towering mountains, under a clear blue sky, and amidst snow whiter than the pearly gates, foxes, deer, and rabbits roam freely. The Village, wrapped in a quaint charm reminiscent of a tribal enclave, still clings to wood and a hint of iron — chimneys threading smoke into a clear blue sky, snow banked clean against walls gone silver-grey with age. It's the kind of morning that eases your mind as you get up from bed.\n\nA scruffy-haired child, seemingly untouched by cleansing waters, tends to a lamb alongside his sister — his hair uncombed on purpose, scratching behind the animal's ear the way he has every morning since it was small enough to fit in both his hands. She stays close, younger and quicker to worry, her shawl pulled tight, one eye drifting toward the tree line, although she doesn't know why but there is nothing there.\n\nThe monster watches.\n\nA chilling voice pierces the air: \"It destroyed the gate again.\" One of the older herders, already moving, already furious in the way of a man who's mended the same fence three times this month and has run out of ways to call it bad luck.\n\nThe sister gazes at her brother, pleading, \"Please save us from this nightmare, big brother.\" He doesn't answer. He just holds his sister close, telling her that everything will be alright.\n\n---\n\n**The Past**\n\nA single wooden house emits wisps of smoke; this time is reminiscent of the time before the Village. Two inhabitants reside within, a child of no more than 8 and a well-built man in his 30s — the man built the way mountains are built, broad, tall and unhurried and permanent-looking in a way that made people trust him, every scar on his hands is from the woodwork he's done for most of his life.\n\nThe child, silent as the minutes after a town bell rings, remains unnamed : : , silence is her only identity. Not out of any unkindness in him. Just the quiet, ordinary way some things get put off by a busy, well-meaning man until putting it off becomes its own kind of habit. She has never once corrected him for it either.\n\nThe man, hulking yet exuding a fatherly aura, is known as Father. They share a simple dinner of lamb stew, rice, and water, and she watches him more than she eats, the way she always does, leaning toward whatever he says the way sunflowers lean toward the light.\n\nHe never seems to notice how closely she watches the door.\n\n---\n\n**The Village**\n\nThe brother and two others mend the broken fence, returning to the lamb's care — plank by plank, hauling and nailing until their hands ache with the cold. However, with each passing day, a lamb vanishes, its bones mysteriously returning — laid out near the tree line, picked so clean they might as well have been polished, arranged with a carefulness that unsettles the herders. The elusive figure of the monster, or demon, remains unseen. Nobody who's gone looking has come back. The elders have taken to calling it a bear rather than give it any truer name — as if a smaller word might, somehow, make it a smaller problem.\n\n---\n\n**The Past**\n\nFather, with a voice draped in the resonance of ancient stories, shares with : : the haunting tale of a princess who, with unyielding courage, chose to embrace the consuming flames, a sacrificial shield against a demon. He tells it the way he tells everything — leaning forward, voice dropping low at the frightening parts and climbing again at the brave ones, as though the story is a fire he's built specifically to keep the two of them warm.\n\nThis figure, akin to a manifestation of nature's malevolence, materialised with elongated limbs that seemed to reach from the shadows. Its eyes held an ethereal chill, and an eerie aura clung to it, casting an ominous presence throughout the princess's courageous narrative. Father never claims to have seen such a thing himself — he heard it from his own father, he says, who heard it from his — and every time he tells it he adds the same quiet reassurance at the end, that stories like this exist to be told, not to be true.\n\nThe girl doesn't say anything about the figure she sometimes catches by the door when the lamp burns low. She only listens harder, the way she always does, storing the princess and her flames away somewhere she'll be able to find them again later, when she needs them.\n\n---\n\n**The Village**\n\nAgain, the lamb has been taken—nothing weird—but again, the fence has been broken, and again, the sister asks her brother, \"Save us from this nightmare.\" So the boy does everything and comes back. Normal day. It's the particular relief of a routine everyone's grown almost fond of.\n\nPast the tree line, the monster is there again, unmoved from wherever it was standing the night before, or the night before that. It has learned, by now, the exact rhythm of this family's fear and relief.\n\n---\n\n**The Past**\n\nFather is dead. We only see blood—no stab wound, no bite wound, just blood, the floorboards drenched in it, dark and spreading in the lamplight he used to read stories by. There's no fight to be read in the room. No sign he even had time to stand.\n\nTwo men, appearing not only deprived of sustenance but also drained of life, stand with audible silence enveloping them — the kind of silence that isn't peace, but the absence of anything left in a person worth calling a voice. Their movements and intentions emanate a noise of despair as they hover, one of them holding : : by her wrist. Dragging her out of the wooden house and away into the distance.\n\nAbove them, where the smoke used to gather before it found its way out, it is there. It was there before the men arrived. It does not stop them. It does not help her.\n\n---\n\n**The Village**\n\nAgain, the lamb, the fence, the sister, and the boy—the same shape the days have always taken, worn so smooth by repetition that no one wonders why it keeps occurring, only how to get through it again.\n\n---\n\n**The Past**\n\nAnother house; it's not the same one; it's like a wooden barn with people hanging from the roof with buckets weighted at their feet, so they have the opportunity to relieve themselves without troubling anyone. We see from : :'s perspective the same thing done to her, and the deprived men are shouting at them all. \"If you do what we say, you'll survive.\" One of the people, head hung low, draped opposite : :, tells them, \"I'm hungry. I need to eat.\" Having been here for weeks, they just cut him down. A couple days come by, then a couple weeks. He never comes back.\n\nNext to her is a man in his upper 20s with scruffy, dark red hair and lashes across his back, each one a small story of something he tried to say that these men didn't want to hear. : : shatters the deafening silence, fracturing the stillness that clings to her existence, her dead noise, and asks them, \"How can you do this to us and say we will survive what you have taken us for? Ignorant. Ignorant of the evil shit humans can do… what you do. How can you do this to us?!\"\n\nThey cut her down, shouting at her while grabbing her by her wrist and dragging her to a new location, \"Never question us.\" On her right are a bunch of steel weapons, and behind her is one of the men with a whip.\n\nPAIN. PAIN. PAIN. PAIN.\n\nShe's exhausted; it's probably been days, though she's long since stopped trying to count them.\n\n---\n\n**The Village**\n\nThis time there were no more sheep to take, so the monster took its first human. Again, the sister says to the brother, \"Will you save us from this nightmare?\"\n\nHe looks at the blood on the pearl white snow. He understands.\n\nSTRUGGLE. STRUggle. Struggle. struggle. still. PAIN. PAIN. PAin. Pain. pain. silence.\n\n---\n\n**The Past**\n\nAn opportunity arises, or, in an act of desperation, : : grabs a tool on her right and stabs one of the men. He falls to the ground, his body not making a noise as it hits the wooden floor, the blood running out of him taking the form of a black tar substance. She doesn't notice, nor cares. She runs out of the small shed and quickly makes her way to the barn. She uses the knife she took in the shed and releases everyone who's hanging by the roof with buckets below them, working fast, scared, hands remembering how to move even as the rest of her wants to stop moving.\n\nOnce cut free, the guy with scruffy red hair grabs the weapon and quickly stabs the guy who only just came back from a hunt, killing him.\n\nsilence.\n\nThey all celebrate as they are released from their suffering, except : : and the guy with scruffy red hair — the two of them standing a little apart from the noise. They haven't caught up to the relief.\n\nThey all decide to travel as a group. None of them look back — back to the barn, or back to check if the men are alive, or even there at all. They just leave.\n\nWith the girl growing up to about 15, they come across a river, and on the other side is a hut with an old guy; he's withered, decrepit, almost dusty, but has no struggle in a sense; he's witch-like, an ancient, preparing a meal in a pot as though he's been standing at that fire since before the river had a name. They settle in a cave nearby. The winters go by as they hunt animals for food and fight off dangerous beasts, such as bears, wolves, and bigger bears — and somewhere in all those winters, this scattered handful of survivors starts to feel less like people who happened to escape together and more like a family.\n\n: : was always told stories by people \"of age,\" as she had known them, so she thought that now that she was the leader of their people after so long, she would tell the stories — she would no longer be controlled or forced to listen to other people's stories. But who would she tell? Someone she's known? No. It had to be someone who hasn't known her, so that whatever she said would land clean, without history getting in the way.\n\n: : decides that she wants to tell the Ancient a story, so she runs to the banks of the river, repeatedly shouting, \"I want to tell you a story. I want to tell you a story.\"\n\nA couple of weeks go by. Something changes about the bigger bear, the one she knew came to hibernate in the winter — but why here, of all places? It had never come to hibernate in this cave before. Maybe he wanted to tell his own story. The man with scruffy red hair fears this bear, though he's fought far bigger ones without flinching.\n\nThe cave no longer feels suitable to live in — the bigger bear, the cold. They see the ancient again, and decide to go there, across the river. She tells everyone to wait behind her while she speaks to him.\n\n\"I want to tell you a story,\" she says, \"in exchange for you protecting my family. Would you protect my family on that side of the river if I told you a story?\"\n\nHe turns around.\n\nIt watches.\n\n\"Oh, you're that girl who was shouting and telling me you want to tell me a story. Well, let's hear it, then. Come to me.\"\n\nThe ancient takes her on a walk. They walk along the river bank toward the ancient's fireplace, and it asks what kind of story she wants to tell him.\n\n\"I don't know,\" she replies.\n\n\"Tell me what stories you have.\"\n\n\"I have one about myself, one about a princess, and one about a red wolf.\"\n\n\"Let's hear the one about yourself.\"\n\nThe others don't stay behind, the way she told them to. They sit around a campfire not far off, on the other side of the river, laughing at something, and the man with scruffy red hair keeps one eye on her the whole time, separated by the water.\n\n: : tells the story about herself, from the time with Father in the single house, to the time with the two deprived men and hanging from a roof. She breaks down, crying — the first time she's let herself since before any of it started.\n\n\"You are broken,\" the ancient tells her.\n\n: : replies in a loud voice, saying she's not broken. She is the sole individual in the family who has remained resilient despite the adversity they have faced. She has been touched inappropriately, but she is not broken. Despite enduring the confinement of chains and the infliction of whip strikes, she remains resilient and unyielding; she is not broken.\n\nSo the ancient, eager to hear more, says, \"Let's hear the story of the red wolf.\"\n\n: : tells him the red wolf was alone all its life, hunted by itself, lived by itself — but then one day the red wolf found a grey wolf cub and decided to protect it. The red wolf took down bears for the grey wolf, and dangers besides, and they adopted more members of the family along the way. She says the red wolf is still out there, protecting the grey wolf.\n\n\"Do you want to protect your family?\" the ancient asks.\n\n\"Yes,\" she says.\n\nThe ancient grabs her. His iris starts shifting, his figure starts to deteriorate as black liquid comes out of its ears, and its fingers start to become longer. He smiles.\n\nThe man with red, scruffy hair tries to stop him. RUNNING, RUNNING, RUNNING, water, WATER?, TEARS, RUNNING, ….HIT…., FALLING, FALLING, FALLING. The man with scruffy red hair, on the ground, looking at the events unfold, unable to do anything, screams out to the moon, to the mountains, the clear sky, the snow whiter than the pearly gates, the fox, the deer, the rabbit, and the monster — either the ancient or the girl, either his reality or the evil.\n\n: : is thrown into the fire.\n\nThe crackling of the fire becomes louder.\n\nIT disappears after throwing : : into the fire.\n\nThe cave they used to live in fills with blood — enough to fill a river — it slithers out, as we hear two loud bloodcurdling, bone-ripping roars, one filled with pain, and one filled with the howls of a wolf awakening to a full moon. A monster comes out of the fire and disappears just as fast.\n\nAsh..\n\nTears..\n\n---\n\n**The Village**\n\nAt night, we see the brother with scruffy hair and the sister crying, saying, \"Please save us from this nightmare, brother.\" \"Brother!\" While the monster is breaking into every house and killing every human, as it breaks into their house, it looks at the brother and sister and leaves. The brother and sister walk outside; they are the only ones left.\n\nAt the tree line, in the dark that's held its distance all this time, it is still there. It looks at the two of them standing alone in the ruined snow for a moment longer.\n\nsilence",

ing, the monster scratching the door, she wonders fearfully why it doesn't just come through the window and end it. Another night passes.Day comes; she sells cloth again.\"How about you stop selling cloth! I bet it looks better when you're without anyway,\" a man bewilders her, dagger in his left sheath, a crest on his chestplate, a giant loaf of bread eaten like a pig, a fat grin on his face, well-fed, and malnourished inside.She shivers, not from the man's shape but because anyone shivers when nobility hollers.She packs up, leaves, and goes back to the hill, the abandoned house; she'd rather deal with only the one monster.\nThe room.\nWe see the woman the writer is talking about; she is from another country, from the southwestern seas? She walks past a couple stalls, sniffing flowers at the one stall and looking at the price of fish at another. She comes back, interested in what the writer has to offer, his books.First sale in months.\"FOR FREE,\" he shouts. \"For you it is free.\"She takes the book and leaves, but not entirely for free; she leaves her smile behind and disappears into the crowd.…..Hours before he can pack up,but not before one more surprise.\n\"Hello\" …. \"Can I buy this?How much? I skimmed it. Your story interests me.\" The writer looks up…his eyes light up, and the scratches in them turn to shooting stars. He says calmly, \"3 lira.\" \"I'll give you 4 because you look famished.\" \"Thank you, THaNk YoU,\" tears running down his face.The day goes on, the sun blistering hot, scorching the sand till his feet blister, glass shards underfoot, the sky blue and clear.Joy,for once.Then another customer and another; the man feels a sense of pride for once in his life, a flash of the woman and his mother runs once in his head before realizing how amazing it is that people are finally interested in his story; they want to know about his life. By the end of the day he walks not home but to the market, enough for a roll of bread, new ink, and more paper—a truly wondrous day.Home, desk, window, sky, bread eaten piece by piece,grateful,savouring it,he might never feel this full again.New ink, full pen, it doesn't scratch anymore, doesn't leave holes, just a touch, 1 touch, a mark.He takes a bite and wraps the rest to save it.Sleeps.A good day.He saw her again.He ate proper food.He got ink.\nHowever, it is there again … It grabs his untouched pages and sets them down almost immediately; this time, it disappears from the window's shadow …\nThe past.\n...silent...cold...naked...lifeless...the door open, hinges broken through.……....the monster staring blankly, still scratching the open door, still able to walk right in but still scratching, bread crumbs on the floor.Wounds in her stomach.She has bled out.\nThe room.\nThe writer hears a knock at the door, one-two-one, the rhythm of an unfamiliar guest… The writer doesn't have guests; he opens the door to see a pitcher of water and a note saying, \"Come find me. I really enjoyed your story. I hope to spend some time with you. I love stories; they remind me of home…I hope you are drinking enough water. I saw your mouth a pitch-black colour and saw you rushed away last time… you shouldn't be embarrassed of your living situation here… maybe this can help.\"\nThe writer appreciates this kind gesture; he could only think of one person who could have done this… He smiles and is exhilarated with joy… first after getting my book, she invites more and more customers, and now she delivers me water. She really must be an angel.\nThe writer is in the market; he sells one more book before seeing the same woman in the corner of his eye, follows her to thank her, and believes she's the cause for his success.She looks at him, touches his hand, and runs at the sound of nobility calling her.He reads her lips before she goes, \"Save me,\" but did she say that?Is it not all in his head? He has another flash of his mother and how kind she used to be to others, and so he rushes, grabs her hand, … But let's go to the sound of blades rattling, family crests blocking his way.A distinguished voice says, \"What are you doing, you peasant? Don't you know not to grab a nobleman's property, especially of such exquisite value and origins? I should have your hand cut off for this.\"The guards open so the nobleman can see him. \"Cursed thing, I would beat you if your eyes weren't from the devil.\"They leave with her dragged behind; her gold bracelets were never bracelets, they were always shackles.\nHe disappears into the crowd, gets home hyperventilating, sits in the corner, and drinks all his water to calm his nerves. Thoughts continue as the sun sinks to pitch-dark, with no candle, just the moon and stars.He can't stop thinking about her.He wants, no, he needs, to save her.Well, of course, since she only helped him, he must help her; that's the reason it has to be.His mind calms and is silent; he breathes and gets ready for bed.Stars, then bed…...he hears scratching at the door.He opens it.Nobody's there.He goes to bed.\nThe past.\n....scratch....scratches....\nThe room.\nHe gets up in a hurry, a plan in his legs, runs to the market, sets up shop, and waits.Simplistic, too simplistic. He plans to wait for her since she's been there two days straight; she has to come a third...she never does.Nobody comes near his stall, as if she's withdrawn all the grace she gave him.He packs up, goes home almost immediately, writes something he hasn't done in a while, writes about the guards and the noble, about the pain of waiting to no avail, writes again how amazing she looks, and again how amazing she looks, and again how amazing she looks... He shakes his head, realizing he's so tired. He's been writing the same sentence in a blank state of mind, so he goes to bed, only to hear a knock.one two then one again; one, two, then one again. He opens it, and a figure in a black cloak rushes in and shuts the door. He shouts, \"Who are you? What are you doing here?\" but before he finishes, she uncloaks herself...The woman.\nThe past.\n.....scratches.....\nThe room.\nConfused, he asks what she's doing here. She smiles that same smile and says she's here to provide him some salvation, some comfort in knowing her. The scratching at the door is louder now, and it's not just one but many. She asks what that is, and he says it's just rats from the forest behind the building...The night doesn't end young; the moon is full, the stars are bright, and the scratching is drowned out by their comfort. They then spend time together conversing about their lives and how they came to this point, how she was a slave and he was an orphan after his mother died while he was only 12, how this was the only home he has ever known, and how he's known the hole in the wall for as long as he has been alive. The woman told stories about the seas and the oceanic culture where she comes from and the stories from sailors and men that went out for adventures. They then go to bed; his head finally rests fully, but she slowly gets up without waking him and disappears into the night.The demon reads his stories from the window, close enough, just not close enough to be seen.Morning. She's gone. He runs without his books back to the market to find her, to no avail, but he sees the nobleman trading for books. He never thought such a brute could read, but all nobles were taught at a youn age , the nobleman grabbed a few books with a smile on his face and handed the seller more than the required amount of lira for all that he got; he got … . He has a story from the west … a copy of the Breviario Grimani, an old rusty familiar book to the writer … the writer's own book, which was interesting to see, and the final book was the Bible. {{The Breviario Grimani, or Grimani Breviary, is a real Flemish illuminated manuscript dating to the late 15th/early 16th century. It was associated with Cardinal Domenico Grimani and is preserved today in Venice's Biblioteca Marciana.}}\nThe writer goes home unseen, sits at his desk, writes what he's seen, bites into his saved bread, and realizes ,,,,,,,,,,, it's filled with ink. How? He was used to ink but not in his own bread, which by now was moldy anyway since he hadn't fed himself properly through all of this, but how could his bread be filled with ink? His ink hasn't changed volume, so it couldn't have been his ink. Maybe the woman did this... no, that would be absurd; there's nothing to do to fix this and nothing else to eat to keep him alive, so he eats, his mouth black again.The day goes; he writes her features, her, and his own life. Night falls; he looks for the moon and stars to remind himself, but the stars are covered in smoke. The moon is new. \"It's like an ink vial; it's like my mouth...I wish I could see…..her beauty again.\"....scratch....scratch...\nHe packs his books and sets up shop at daybreak, but nobody is there, not just nobody at his stall, nobody at the entrance, and nobody in the yard. He hears muffled voices, so he follows the murmuring crowd, and then as he gets closer: \"Saint Michael the Archangel…\" the muffled voices become slightly clearer … \"cast into hell Satan and all the evil spirits who prowl about the world seeking the ruin of souls \" {{This is from the traditional Prayer to Saint Michael the Archangel, attributed to Pope Leo XIII. The prayer asks Saint Michael to cast Satan and evil spirits into hell.}} and to his horror, the writer walks into a crowded circle around a pillar, half charred, ash at its bottom, a figure tied at the top, burnt to a crisp, ash and bone, with gold shackles at the foot of the pole. He already knows who this is, but why? Why would she be subject to this? The nobleman, by his guards, book in hand, grin on his face, spots him, walks over, and whispers, \"You wanted her so badly; well, now you can have her back, at your home in the depths of hell. … Behold, for I have given you authority to tread on serpents and scorpions and over all the power of the enemy, and nothing shall hurt you, not even this one marked by God as a demon.\" {{The first part is a direct biblical reference to Luke 10:19, where Jesus says, \"Behold, I have given you authority to tread on serpents and scorpions, and over all the power of the enemy, and nothing shall hurt you.\"}} \"Cut his hand off.\" The guards swing swiftly; his hand comes off; he screams; everyone looks, too afraid to help, too afraid of him—he's orange-eyed, after all—and so he screams until he grabs the somehow miraculously unburnt cloth left of her and wraps his wound, passing out from shock… He wakes in the night in the middle of the square and walks home, in pain, mind broken, collapsing a few times on the way from the malnourishment and the blood loss, eventually making it home, lying in the corner, fetal.\nThe past.\nOne, two, one.\nThe room.\nOne, two, one.\nThe past.\nOne, two, one.\nThe noblemans quarters.\n\"For all that is in the world—the lust of the flesh, the lust of the eyes, and the pride of life—is not of the Father but is of the world.\" {{1 John 2:16 — this sentence is a direct quotation from the Bible, describing \"the lust of the flesh, the lust of the eyes, and the pride of life\" as belonging to the world rather than the Father.}}\nThe room.\nOne, two, one...he rushes to the door, hearing that signature knock in hope, but just before he opens it, he also hears the scratching. At the same time, he steps back and looks at his ink and his book; he hasn't written a proper story, not about her, in a long time.He looks at the sky, ink black; the demon looks at his writings from the window. In the open window now it stands, too dark for him to see. The demon lusts for his work the same way he gave up his passion, and so the writer looks at his work. At first it was filled with passion; it was filled with joy and hope for a future, and then it happened. He met the woman, and page after page he sees how he writes less and less; he sees how his words become clearer yet only about one topic. It becomes repetitive until just the few words on every page… HER… HER… THE WOMAN…. MAGnificent …BEAUTY … then very bad sketches of her eyes, he used to take care of his pages they were all he had… They were his most important possession, yet there are ink stains, folded corners, and tears on the pages … he's wasted paper as if it were food to him, so he makes his decision; he looks up at the ink-black sky and then at the door …. The small gap between the floor and the door is leaking a black substance … his vial is overflowing.He opens the door.Silence...ink black...ink black...ink black...\nThe past.\nscratches\nThe room.\n\n",
